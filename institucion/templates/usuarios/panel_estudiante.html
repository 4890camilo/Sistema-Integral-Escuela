<!-- institucion/templates/usuarios/panel_estudiante.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Colegio - Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    {% load static %}
    <style>
        body { background-color: #f0f2f5; font-family: 'Arial', sans-serif; }
        .panel-header { background-color: #ffffff; padding: 1rem; border-bottom: 1px solid #dee2e6; }
        .card { border-radius: 10px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="panel-header">
            <h2 class="text-center">Panel del Estudiante</h2>
            <img src="{% static 'images/logo_colegio.jpg' %}" alt="Logo del Colegio" class="img-fluid" style="max-width: 150px; display: block; margin: 0 auto;">
        </div>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h5>Consultar Calificaciones</h5>
                    <p>Revisa tus calificaciones (RF-003).</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h5>Consultar Asistencia</h5>
                    <p>Revisa tu asistencia (RF-006).</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h5>Material Didáctico</h5>
                    <p>Accede a materiales (RF-009).</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdl" crossorigin="anonymous"></script>
</body>
</html>
