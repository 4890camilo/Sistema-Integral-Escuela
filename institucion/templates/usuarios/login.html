
<!DOCTYPE html>
<html>
<head>
    <title>Iniciar Sesión</title>
    {% load django_bootstrap5 %}
    {% bootstrap_css %}
    <style>
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { width: 400px; padding: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="text-center">Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            {% bootstrap_form_errors %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
        </form>
        <p class="mt-3 text-center"><a href="{% url 'register' %}">Registrarse</a></p>
    </div>
    {% bootstrap_javascript %}
</body>
</html>
